name: Multiplatform Release & Packaging Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  # ====================================================================
  # JOB 1: Menentukan Tag Versi & Update Metadata Repository (About)
  # ====================================================================
  prepare-tag:
    name: Prepare Tag & Repo Metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag_step.outputs.release_tag }}
      clean_version: ${{ steps.tag_step.outputs.clean_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine or Create Git Tag
        id: tag_step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            echo "Latest Tag Found: $LATEST_TAG"
            if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
            else
              MAJOR=1
              MINOR=0
              PATCH=0
            fi

            PATCH=$((PATCH + 1))
            TAG="v${MAJOR}.${MINOR}.${PATCH}"

            while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; do
              PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
            done

            echo "Auto Bumped New Tag: $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          CLEAN_VER="${TAG#v}"
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VER" >> $GITHUB_OUTPUT

      - name: Auto-Update Repository About, Homepage & Topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo edit \
            --description "🚀 Modern, lightweight, and ultra-fast YouTube desktop client built with Go, Wails, React, and yt-dlp." \
            --homepage "https://github.com/${{ github.repository }}" \
            --add-topic "youtube" \
            --add-topic "desktop-app" \
            --add-topic "wails" \
            --add-topic "golang" \
            --add-topic "react" \
            --add-topic "typescript" \
            --add-topic "yt-dlp" \
            --add-topic "ffmpeg" \
            --add-topic "inno-setup" \
            --add-topic "media-player" \
            --add-topic "linux" \
            --add-topic "ubuntu" || echo "Skipping repo metadata update"

  # ====================================================================
  # JOB 2: Build Binaries Windows (Inno Setup Installer + Portable ZIP)
  # ====================================================================
  build-windows:
    name: Build Windows Packages
    needs: prepare-tag
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Frontend Dependencies & Build Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
          cd ..

      - name: Download Offline Media Engines (yt-dlp & FFmpeg)
        shell: powershell
        run: |
          if (-not (Test-Path "build\bin")) { New-Item -ItemType Directory -Path "build\bin" -Force | Out-Null }

          Write-Host "Downloading yt-dlp.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "build\bin\yt-dlp.exe"

          Write-Host "Downloading FFmpeg bundle..."
          $ffmpegZip = "$env:TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $ffmpegZip
          Expand-Archive -Path $ffmpegZip -DestinationPath "$env:TEMP\ffmpeg-extracted" -Force
          $ffmpegExe = Get-ChildItem -Path "$env:TEMP\ffmpeg-extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path "$env:TEMP\ffmpeg-extracted" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "build\bin\ffmpeg.exe" -Force
          Copy-Item $ffprobeExe.FullName -Destination "build\bin\ffprobe.exe" -Force

      - name: Build Wails Application
        run: |
          wails build -platform windows/amd64

      - name: Build Standalone Installer & Portable Package
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\build_packages.ps1 -Target all -Version "${{ needs.prepare-tag.outputs.release_tag }}"

      - name: Stage Windows Release Files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "dist\windows-flat" -Force | Out-Null
          
          # Strictly verify that Inno Setup Installer exists
          $installers = Get-ChildItem -Path "dist\standalone" -Filter "*Installer*.exe"
          if ($installers.Count -eq 0) {
              Write-Error "CRITICAL: Inno Setup Installer (*Installer*.exe) was NOT generated in dist\standalone!"
              exit 1
          }
          foreach ($i in $installers) {
              Copy-Item $i.FullName -Destination "dist\windows-flat\" -Force
          }

          Copy-Item "dist\standalone\YouTubeDESK.exe" -Destination "dist\windows-flat\" -Force
          Copy-Item "dist\portable\YouTubeDESK-Portable.zip" -Destination "dist\windows-flat\" -Force
          
          Write-Host "=== Verified Staged Windows Files ==="
          Get-ChildItem "dist\windows-flat" | Select-Object Name, Length

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: dist/windows-flat/*
          retention-days: 1

  # ====================================================================
  # JOB 3: Build Binaries Linux (Ubuntu .deb + Generic .tar.gz)
  # ====================================================================
  build-linux:
    name: Build Linux (Ubuntu) Packages
    needs: prepare-tag
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Build Dependencies (GTK3 & WebKit2GTK 4.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies & Build Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
          cd ..

      - name: Build Wails Binary for Linux
        run: |
          wails build -platform linux/amd64

      - name: Package Linux Artifacts (.deb & .tar.gz)
        run: |
          VERSION="${{ needs.prepare-tag.outputs.release_tag }}"
          CLEAN_VER="${VERSION#v}"
          mkdir -p dist/linux

          # 1. Package .deb installer for Ubuntu / Debian
          DEB_DIR="dist/linux/deb_pkg"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/512x512/apps"

          cp build/bin/YouTubeDESK "$DEB_DIR/usr/bin/youdesk"
          chmod 755 "$DEB_DIR/usr/bin/youdesk"

          cp build/appicon.png "$DEB_DIR/usr/share/icons/hicolor/512x512/apps/youdesk.png"

          cat << 'EOF' > "$DEB_DIR/usr/share/applications/youdesk.desktop"
          [Desktop Entry]
          Name=YouDesk
          Comment=Modern YouTube Desktop Client
          Exec=/usr/bin/youdesk
          Icon=youdesk
          Terminal=false
          Type=Application
          Categories=AudioVideo;Player;Network;
          EOF

          cat << EOF > "$DEB_DIR/DEBIAN/control"
          Package: youdesk
          Version: $CLEAN_VER
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: kyy-95631488 <riskir5622@gmail.com>
          Description: Modern, lightweight YouTube desktop client built with Go, Wails, React, and yt-dlp.
          EOF

          dpkg-deb --build "$DEB_DIR" "dist/linux/youdesk_${CLEAN_VER}_amd64.deb"

          # 2. Package Portable Tarball for any Linux Distro
          PORTABLE_DIR="dist/linux/YouDesk-linux-amd64"
          mkdir -p "$PORTABLE_DIR"
          cp build/bin/YouTubeDESK "$PORTABLE_DIR/YouDesk"
          cp build/appicon.png "$PORTABLE_DIR/icon.png"
          cat << 'EOF' > "$PORTABLE_DIR/youdesk.desktop"
          [Desktop Entry]
          Name=YouDesk
          Comment=Modern YouTube Desktop Client
          Exec=./YouDesk
          Icon=./icon.png
          Terminal=false
          Type=Application
          Categories=AudioVideo;Player;Network;
          EOF
          chmod +x "$PORTABLE_DIR/YouDesk"
          tar -czvf "dist/linux/YouTubeDESK-linux-amd64.tar.gz" -C dist/linux YouDesk-linux-amd64

      - name: Stage Linux Release Files
        run: |
          mkdir -p dist/linux-flat
          cp dist/linux/*.deb dist/linux-flat/
          cp dist/linux/*.tar.gz dist/linux-flat/
          echo "Staged Linux Files:"
          ls -lh dist/linux-flat

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: dist/linux-flat/*
          retention-days: 1

  # ====================================================================
  # JOB 4: Menggabungkan Semua Paket Windows & Linux ke Dalam 1 Rilis
  # ====================================================================
  publish-unified-release:
    name: Publish Unified Release (Windows & Linux)
    needs: [prepare-tag, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Create Assets Directory
        run: mkdir -p release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: release-assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-assets
          path: release-assets

      - name: Verify All Downloaded Assets
        run: |
          find release-assets -mindepth 2 -type f -exec mv -t release-assets {} + 2>/dev/null || true
          find release-assets -mindepth 1 -type d -delete 2>/dev/null || true
          echo "=== All Final Release Assets to Publish ==="
          ls -lh release-assets

      - name: Publish Unified Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-tag.outputs.release_tag }}
          name: YouDesk ${{ needs.prepare-tag.outputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🚀 YouDesk ${{ needs.prepare-tag.outputs.release_tag }}

            ### 📦 Official Installation Packages:
            - **`YouTubeDESK-Installer-${{ needs.prepare-tag.outputs.release_tag }}.exe`**: 🪟 Windows Setup Installer (Inno Setup 6 Wizard, Desktop & Start Menu shortcut, uninstaller, yt-dlp & FFmpeg engines).
            - **`YouTubeDESK-Portable.zip`**: 🪟 Windows Portable Bundle (extract & run directly).
            - **`YouTubeDESK.exe`**: 🪟 Windows Standalone executable.
            - **`youdesk_${{ needs.prepare-tag.outputs.clean_version }}_amd64.deb`**: 🐧 Ubuntu / Debian Package (`sudo dpkg -i`).
            - **`YouTubeDESK-linux-amd64.tar.gz`**: 🐧 Generic Linux Portable Archive.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
